name: CloudCom upstream release

on:
  schedule:
    - cron: '23 10 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudcom-upstream-release
  cancel-in-progress: false

jobs:
  prepare-update:
    if: github.repository == 'osvendor/cloudcom' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
      - name: Prepare released upstream code as a draft PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/cloudcom/update-upstream.mjs
