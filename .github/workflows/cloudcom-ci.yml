name: CloudCom CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudcom-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  delta:
    name: Validate cumulative fork delta
    runs-on: ubuntu-24.04
    outputs:
      docs_only: ${{ steps.delta.outputs.docsOnly }}
      api: ${{ steps.delta.outputs.api }}
      web: ${{ steps.delta.outputs.web }}
      shared: ${{ steps.delta.outputs.shared }}
      native: ${{ steps.delta.outputs.native }}
      infra: ${{ steps.delta.outputs.infra }}
      unsupported: ${{ steps.delta.outputs.unsupported }}
      baseline_commit: ${{ steps.delta.outputs.baseline_commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: delta
        name: Verify upstream baseline and classify the cumulative delta
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/cloudcom-delta.mjs --verify-remote
      - name: Reject unsupported product impacts
        env:
          UNSUPPORTED: ${{ steps.delta.outputs.unsupported }}
        run: |
          if [ "$UNSUPPORTED" = 'true' ]; then
            echo "::error::The cumulative fork delta includes unsupported paths; see the classifier log."
            echo "Add an explicit classifier and a real validation job before treating this delta as green."
            exit 1
          fi

  security:
    name: Secret detection
    needs: delta
    if: always() && needs.delta.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned gitleaks
        run: |
          set -euo pipefail
          version="8.21.2"
          asset="gitleaks_${version}_linux_x64.tar.gz"
          checksums="gitleaks_${version}_checksums.txt"
          base_url="https://github.com/gitleaks/gitleaks/releases/download/v${version}"
          workdir="$(mktemp -d)"
          trap 'rm -rf "$workdir"' EXIT
          curl -sSfL -o "$workdir/$asset" "$base_url/$asset"
          curl -sSfL -o "$workdir/$checksums" "$base_url/$checksums"
          (cd "$workdir" && grep "  ${asset}$" "$checksums" | sha256sum -c -)
          tar -xzf "$workdir/$asset" -C "$workdir" gitleaks
          sudo install -m 0755 "$workdir/gitleaks" /usr/local/bin/gitleaks
      - name: Scan the cumulative fork delta
        run: gitleaks detect --source . --log-opts="${{ needs.delta.outputs.baseline_commit }}...HEAD" --redact --verbose

  workflow-security:
    name: Workflow security and syntax
    needs: delta
    if: needs.delta.outputs.infra == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Scan CloudCom workflow security
        run: node .github/scripts/check-workflow-security.mjs
      - name: Install checksum-verified actionlint
        run: |
          curl -sSfL -o actionlint.tar.gz https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz" | sha256sum -c -
          tar xzf actionlint.tar.gz actionlint
      - name: Lint CloudCom workflows
        run: ./actionlint -shellcheck=

  javascript:
    name: API and web delta validation
    needs: delta
    if: needs.delta.outputs.docs_only != 'true' && (needs.delta.outputs.api == 'true' || needs.delta.outputs.web == 'true' || needs.delta.outputs.shared == 'true' || needs.delta.outputs.infra == 'true')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.34.5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run API tests and build when API or shared code changed
        if: needs.delta.outputs.api == 'true' || needs.delta.outputs.shared == 'true'
        run: |
          pnpm --filter @breeze/api exec vitest run src/services/cloudcom/remoteAccessOptions.test.ts src/routes/devices/cloudcomRemoteAccess.test.ts src/services/remoteAccessLauncher.test.ts src/services/remoteAccessProviders.test.ts src/routes/devices/core.remoteAccessLaunch.test.ts
          pnpm --filter @breeze/api build
      - name: Run web tests and build when web or shared code changed
        if: needs.delta.outputs.web == 'true' || needs.delta.outputs.shared == 'true'
        run: |
          pnpm --filter @breeze/web exec vitest run src/components/cloudcom/RemoteAccessAlternatives.test.tsx src/components/remote/ConnectDesktopButton.test.tsx src/components/remote/ConnectDesktopButton.denied.test.tsx src/components/remote/ConnectDesktopButton.revoked.test.tsx src/components/remote/ConnectDesktopButton.teardownPending.test.tsx src/components/remote/RemoteToolsPage.test.tsx src/components/remote/RemoteToolsPage.liveDesktopAccess.test.tsx
          pnpm --filter @breeze/web build
      - name: Run fork infrastructure contracts
        if: needs.delta.outputs.infra == 'true'
        run: |
          pnpm --filter @breeze/api exec vitest run src/config/envComposeParity.test.ts
          node --test scripts/release/release-image-consumers.test.mjs
          bash scripts/check-guided-setup-systemd-unit.sh
          node --test scripts/cloudcom/update-upstream.test.mjs
          node --test scripts/cloudcom/customization-contract.test.mjs
          node scripts/cloudcom/customization-contract.mjs
      - name: Verify the CloudCom delta classifier
        run: node --test .github/scripts/cloudcom-delta.test.mjs

  native:
    name: Native agent delta validation
    needs: delta
    if: needs.delta.outputs.native == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: agent/go.mod
      - working-directory: agent
        run: go test -race ./...

  complete:
    name: CloudCom checks
    if: always()
    needs: [delta, security, workflow-security, javascript, native]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every applicable check to succeed
        env:
          DELTA: ${{ needs.delta.result }}
          SECURITY: ${{ needs.security.result }}
          WORKFLOW_SECURITY: ${{ needs.workflow-security.result }}
          JAVASCRIPT: ${{ needs.javascript.result }}
          NATIVE: ${{ needs.native.result }}
        run: |
          for result in "$DELTA" "$SECURITY" "$WORKFLOW_SECURITY" "$JAVASCRIPT" "$NATIVE"; do
            if [ "$result" != success ] && [ "$result" != skipped ]; then
              echo "::error::CloudCom validation did not complete successfully: $result"
              exit 1
            fi
          done
          if [ "$DELTA" != success ] || [ "$SECURITY" != success ]; then
            echo "::error::Baseline validation and secret detection are mandatory."
            exit 1
          fi
