name: CloudCom Runner Smoke

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudcom-runner-smoke
  cancel-in-progress: false

jobs:
  smoke:
    if: github.repository == 'osvendor/cloudcom' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: [self-hosted, Linux, X64, cloudcom-linux]
    timeout-minutes: 5
    steps:
      - name: Verify runner and toolchain
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = self-hosted
          test "$RUNNER_OS" = Linux
          node --version
          pnpm --version
          gh --version
          python3 --version
          pkg-config --modversion libpcap
          docker version --format '{{.Server.Version}}'
          docker compose version
          pwsh -NoProfile -NonInteractive -Command '$ErrorActionPreference = "Stop"; $PSVersionTable.PSVersion.ToString(); Import-Module Pester -RequiredVersion 5.7.1; (Get-Module Pester).Version.ToString()'
